<svg xmlns="http://www.w3.org/2000/svg" width="850" height="1800" viewBox="0 0 850 1800">
  <defs>
    <style>
      .box { rx: 14; ry: 14; stroke-width: 2; }
      .title { font: 700 21px Arial, sans-serif; fill: #1f2937; }
      .line { font: 14px Arial, sans-serif; fill: #1f2937; }
      .edge { stroke: #666; stroke-width: 2.2; fill: none; }
      .dash { stroke: #d79b00; stroke-width: 2.2; fill: none; stroke-dasharray: 8 6; }
      .label { font: 13px Arial, sans-serif; fill: #8a5a00; background: #fff; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8.5" refY="5" orient="auto" markerUnits="strokeWidth">
